<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HØISETH</title>
  <meta name="description" content="HØISETH" />
  <style>
    :root {
      --bg: #0A0A0F;
      --indigo: #0D0B1E;
      --gold: #C9A84C;
      --gold-soft: #8d7536;
      --text: #E8E4D6;
      --text-muted: #8a8578;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .mark {
      width: 120px;
      height: 120px;
      margin-bottom: 2.5rem;
    }
    h1 {
      font-family: 'Georgia', serif;
      font-weight: 400;
      letter-spacing: 0.4em;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 1rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      max-width: 440px;
      line-height: 1.7;
    }
    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    a { color: var(--gold-soft); text-decoration: none; }
    a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="50" cy="50" r="22" fill="none" stroke="#C9A84C" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="6" fill="#C9A84C"/>
    <g stroke="#C9A84C" stroke-width="1" stroke-linecap="round">
      <line x1="50" y1="6"  x2="50" y2="20"/>
      <line x1="50" y1="80" x2="50" y2="94"/>
      <line x1="6"  y1="50" x2="20" y2="50"/>
      <line x1="80" y1="50" x2="94" y2="50"/>
      <line x1="18" y1="18" x2="28" y2="28"/>
      <line x1="72" y1="72" x2="82" y2="82"/>
      <line x1="82" y1="18" x2="72" y2="28"/>
      <line x1="28" y1="72" x2="18" y2="82"/>
    </g>
  </svg>
  <h1>HØISETH</h1>
  <p>In silence, the work is done.</p>
  <footer>MMXXVI</footer>
</body>
</html>
